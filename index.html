<style>
:root{--bg:#070a12;--bg2:#0d1222;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--fg:#eef1f7;--mute:#8d97ad;
--g:#22c55e;--y:#f5b82e;--r:#f04461;--acc:#6d8cff;--acc2:#a66bff;--rad:16px;--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(1200px 600px at 10% -10%,#1b2a6b55,transparent 60%),radial-gradient(900px 500px at 100% 0%,#5b2a8a44,transparent 60%),radial-gradient(800px 600px at 50% 120%,#0f5e5a33,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
header{padding:18px 24px 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1440px;margin:0 auto}
h1{font-size:20px;margin:0 10px 0 0;letter-spacing:-.02em;font-weight:750}h1 em{font-style:normal;background:linear-gradient(90deg,#8aa4ff,#c38bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:12px}
nav{display:flex;gap:4px;padding:6px;margin:0 auto 4px;max-width:1440px;overflow-x:auto;scrollbar-width:none;position:sticky;top:8px;z-index:6;
background:rgba(13,18,34,.7);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:14px;width:calc(100% - 40px)}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--mute);padding:9px 14px;cursor:pointer;font:inherit;font-weight:550;border-radius:10px;white-space:nowrap;transition:.2s}
nav button:hover{color:var(--fg);background:var(--glass)}nav button.on{color:#fff;background:linear-gradient(135deg,#4f6cf7,#8b5cf6);box-shadow:0 4px 16px -4px #6d6cff99}
.ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
input,select{background:var(--glass);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #6d8cff33}select option{background:#121828}
main{padding:14px 20px 30px;max-width:1440px;margin:0 auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.card,.tw,.kv div,.disc,.banner,.kpi{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:var(--rad);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
.card{padding:14px 16px;transition:transform .2s,border-color .2s}.card:hover{border-color:rgba(255,255,255,.16)}.card h3{margin:0 0 8px;font-size:14px;font-weight:650}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;box-shadow:0 0 8px currentColor}
.gruen,.gr{background:var(--g);color:var(--g)}.gelb,.ge{background:var(--y);color:var(--y)}.rot,.ro{background:var(--r);color:var(--r)}
.tw{overflow-x:auto;padding:2px}table{width:100%;border-collapse:collapse}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr,table tr{transition:background .15s}table tr:hover td{background:rgba(255,255,255,.03)}
th{color:var(--mute);font-weight:550;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.pos{color:#3ddc84}.neg{color:#ff6b81}ul{margin:0;padding-left:18px}li{margin:4px 0}
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:10px 0;background:#ffffff10}.mute{color:var(--mute)}
.sec{margin:26px 0 12px;font-size:16px;font-weight:700;letter-spacing:-.01em}.lnk{cursor:pointer;border-bottom:1px dotted #ffffff40}.lnk:hover{color:#aab8ff}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tile{border-radius:12px;padding:9px 10px;height:70px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-shadow:0 1px 2px #0008;font-size:12px;overflow:hidden;transition:transform .15s,box-shadow .15s;border:1px solid #ffffff14}
.tile:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px -6px #000}
.tile b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile span{font-size:16px;font-weight:750}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;color:var(--mute);border:0;padding:6px 14px;cursor:pointer;font:inherit;border-radius:9px;transition:.2s}.seg button.on{color:#fff;background:#ffffff1c}
.hm td{text-align:center}.hm .dot{width:14px;height:14px}
.disc{padding:12px 14px;color:#cfd7ea;font-size:13px;margin-bottom:14px}
.sig .card{border-left:3px solid var(--line)}.sig .i{border-left-color:var(--g)}.sig .b{border-left-color:var(--y)}.sig .m{border-left-color:var(--r)}
.score{font-weight:750;float:right;padding:1px 9px;border-radius:20px;background:#ffffff12}
.banner{padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.banner:before{content:"";position:absolute;inset:0;background:var(--bgph);opacity:.35;pointer-events:none}
.banner h2{margin:0;font-size:26px;letter-spacing:-.02em}.banner .pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:8px;background:#ffffff1f}
.banner p{margin:8px 0 0;max-width:900px;color:#d7def0;position:relative}.banner>*{position:relative}
.meter{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--r),var(--y) 50%,var(--g));position:relative;margin:14px 0 4px;max-width:520px}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 10px #fff;transition:left 1s}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));margin-bottom:6px}
.kpi{padding:12px 14px;animation:fade .4s ease both}.kpi small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:21px;font-weight:750;margin:2px 0;font-variant-numeric:tabular-nums}.kpi span{font-size:12px}
.st-hd{padding:16px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(500px 160px at 0% 0%,var(--phc),transparent),var(--glass);margin-bottom:14px}
.st-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-weight:750;font-size:13px;color:#0b0f1a;background:var(--phc)}
.st-hd p{margin:10px 0 0;font-size:15px;line-height:1.45}.st-t{font-size:12px;color:var(--mute);margin-top:6px}
.st-sec{margin:18px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);display:flex;justify-content:space-between;align-items:center}

<script id="appsrc" type="text/plain">
"use strict";
/* ===================== CONFIG ===================== */
const GRUPPEN = {Makro:"Makro",Krypto:"Krypto",Indizes:"Indizes",Oesterreich:"Österreich",China:"China",Aktien:"Aktien/Tech",Rohstoffe:"Rohstoffe",Waehrungen:"Währungen",Halbleiter:"Halbleiter/KI",Energiewende:"Energiewende/Uran",Gesundheit:"Gesundheit",Anleihen:"Anleihen",Schwellenlaender:"Schwellenländer",KryptoAktien:"Krypto-Aktien"};
const TABS = [["start","Heute"],["markt","Markt-Details"],["ideen","Investment-Ideen"],["depot","Mein Depot"],["muster","Musterdepot"],["news","News & Stimmung"],["heute","Übersicht"],["heatmap","Heatmap"],["signale","Signale/Watchlist"],["ampel","Ampel"],["gruppen","Gruppen"],["rankings","Rankings"],["korr","Zusammenhänge"],["backtest","Backtest"],["prognose","Prognose"],["ausstieg","Ausstieg"],["termine","Termine"],["plan","Planer"],["wissen","Wissen"]];
const AMPELN = [["ampel_trend","Trend MA20"],["ampel_return","30T-Return"],["ampel_hoch","Nähe Hoch"],["ampel_rsi","RSI14"]];
// Spalten der Ampel-Tabelle: [Feld, Titel, Formatierer, Ampelfeld]
const AMPEL_SPALTEN = [["kurs","Kurs",fmtK,null],["r1","1T",fmtP,null],["trend_pct","vs. MA20",fmtP,"ampel_trend"],["return_30t_pct","30T",fmtP,"ampel_return"],
["abstand_hoch_pct","Abst. Hoch",fmtP,"ampel_hoch"],["rsi14","RSI",v=>dz(v,1),"ampel_rsi"]];
const RANKINGS = [["return_30t_pct","30-Tage-Return",fmtP,"ampel_return"],["rsi14","RSI14",v=>dz(v,1),"ampel_rsi"],["abstand_hoch_pct","Abstand zum 52W-Hoch",fmtP,"ampel_hoch"]];
const FIB = [0.236,0.382,0.5,0.618,0.786];
// Signal-Schwellen: Summe der Teilscores (je -1/0/+1, sechs Faktoren => -6..+6)
const SIG_INTERESSANT = 4, SIG_MEIDEN = -2;
const WORT = {gruen:"grünen",gelb:"gelben",rot:"roten"}, DE = {gruen:"grün",gelb:"gelb",rot:"rot"};

/* ===================== HILFSFUNKTIONEN ===================== */
const D = JSON.parse(document.getElementById("daten").textContent);
(D.assets||[]).forEach(a=>{if(a.od&&!a.o){let s=0;a.o=a.od.map(x=>s+=x);delete a.od;}});
const D0 = new Date(D.d0+"T00:00:00Z");
function dz(v,d){return v==null||isNaN(v)?"–":v.toFixed(d).replace(".",",")}
function fmtP(v){return v==null||isNaN(v)?"–":(v>0?"+":"")+v.toFixed(1).replace(".",",")+" %"}
function fmtK(v){if(v==null)return "–";const d=v>=1000?0:v>=10?2:4;return v.toLocaleString("de-AT",{minimumFractionDigits:d,maximumFractionDigits:d})}
const dot = a => `<span class="dot ${a}" title="${DE[a]||a}"></span>`;
const cls = v => v>0?"pos":v<0?"neg":"";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"\x26amp;","<":"\x26lt;",">":"\x26gt;",'"':"\x26quot;"}[c]));
const datum = o => new Date(D0.getTime()+o*864e5).toISOString().slice(0,10);
const sma = (a,n) => a.map((_,i)=> i<n-1?null:a.slice(i-n+1,i+1).reduce((s,x)=>s+x,0)/n);
function ema(a,n){const k=2/(n+1);let e=null;return a.map(v=>v==null?null:(e=e==null?v:v*k+e*(1-k)));}
function rsiSer(c,n=14){let up=0,dn=0;const out=[null];for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);
if(i<=n){up+=u/n;dn+=w/n;out.push(i<n?null:100-100/(1+up/dn));}else{up=(up*(n-1)+u)/n;dn=(dn*(n-1)+w)/n;out.push(100-100/(1+up/dn));}}return out;}
const ret = (c,k) => c.length>k ? (c.at(-1)/c.at(-1-k)-1)*100 : null;

/* ===================== KENNZAHLEN PRO ASSET (im Browser berechnet) ===================== */
D.assets.forEach(a=>{
const c=a.c, n=c.length, y=c.slice(-252);                       // y = letztes Jahr
a.r1=ret(c,1); a.r5=ret(c,5);
a.ma50=sma(c,50).at(-1); a.ma200=n>=200?sma(c,200).at(-1):null;
a.hi=Math.max(...y); a.lo=Math.min(...y); a.fibPos=(c.at(-1)-a.lo)/((a.hi-a.lo)||1);   // 0 = 52W-Tief, 1 = 52W-Hoch
const lr=c.slice(-31).map((v,i,s)=>i?Math.log(v/s[i-1]):null).slice(1);
const m=lr.reduce((s,x)=>s+x,0)/lr.length; const crypto=a.gruppe==="Krypto";
a.vol=Math.sqrt(lr.reduce((s,x)=>s+(x-m)**2,0)/(lr.length-1))*Math.sqrt(crypto?365:252)*100;
let pk=-Infinity,dd=0; y.forEach(v=>{pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1);}); a.mdd=dd*100;
// Golden/Death Cross: Lage MA50 vs MA200 und letzter Kreuzungszeitpunkt
const m50=sma(c,50), m200=sma(c,200); a.cross=null;
for(let i=n-1;i>0&&m200[i-1]!=null;i--){ if((m50[i]>m200[i])!==(m50[i-1]>m200[i-1])){a.cross={typ:m50[i]>m200[i]?"Golden Cross":"Death Cross",datum:datum(a.o[i]),tage:n-1-i};break;} }
a.sig=signal(a);

return `<div class="card au-in"><h3>🚪 Wann aussteigen?</h3><p>Für jedes Asset: wo ein <b>Stop</b> sinnvoll wäre (Schutz nach unten), ein <b>nachziehender Stop</b> (wandert mit dem Hoch der letzten 22 Tage nach oben und sichert Gewinne), und bis zu drei <b>Kursziele</b> nach oben für Teilverkäufe. <b>CRV</b> = möglicher Gewinn bis zum Ziel ÷ Verlust bis zum Stop – ab 2 lohnt sich das Risiko meist.</p>
<details><summary>Woher kommen die Zahlen?</summary><p>Stop: nächste Fibonacci-Unterstützung, mindestens 3 % bzw. 1,5 Tagesschwankungen entfernt. Trailing: höchster Kurs der letzten 22 Tage minus k × ATR (ATR = durchschnittliche Tagesschwankung). Struktur: knapp unter der nächsten Unterstützungszone bzw. dem 50-Tage-Schnitt. Ziele: Widerstände, Fibonacci-Erweiterungen 127/162 % und das obere Ende der Prognose-Spanne. 🔥 = Kurs heiß gelaufen (RSI sehr hoch, über Trendkanal/Bollinger oder ungewöhnlich weit über MA200) – nicht automatisch verkaufen, aber Teilgewinne überlegen. ⚠️ = Ausstiegssignal.</p></details></div>

return `<div class="disc">Kurz erklärt: die wichtigsten Begriffe rund ums Investieren und alles, was die App anzeigt. Tippe auf eine Karte zum Aufklappen.</div>`+
H("📘 Grundlagen")+
K("Diversifikation","<p>Geld auf viele verschiedene Anlagen verteilen, damit ein einzelner Absturz nicht alles mitreißt. Wichtig ist, dass sich die Anlagen unterschiedlich bewegen (Aktien, Regionen, Branchen, etwas Gold, wenig Krypto).</p>"+ex("10 Aktien aus derselben Branche sind kaum diversifiziert. Ein Welt-ETF mit 1.500 Firmen aus 23 Ländern schon."),["korr","Zusammenhänge"])+
K("Zinseszins","<p>Erträge werfen selbst wieder Erträge ab. Über lange Zeit wächst das Vermögen dadurch nicht gerade, sondern immer schneller.</p>"+ex("1.000 € mit 7 % pro Jahr: nach 10 Jahren ≈ 1.967 €, nach 20 Jahren ≈ 3.870 €, nach 30 Jahren ≈ 7.612 €."))+
K("Volatilität","<p>Wie stark ein Kurs schwankt. Hohe Volatilität heißt größere Chancen, aber auch größere Rücksetzer – und mehr Nerven.</p>"+ex("Ein Welt-ETF schwankt typischerweise um 15 % pro Jahr, Bitcoin oft 50–70 %."),["korr","Zusammenhänge"])+
K("Risiko und Rendite","<p>Höhere erwartete Rendite gibt es nur gegen mehr Risiko. Wer eine hohe Rendite ohne Risiko verspricht, verschweigt etwas.</p>"+ex("Tagesgeld ≈ 2–3 %, Anleihen ≈ 3–4 %, Aktien langfristig ≈ 6–8 % mit Jahren von −30 %."))+
K("Kosten und Spread bei Bitpanda","<p>Neben Gebühren zählt der <b>Spread</b>: die Differenz zwischen Kauf- und Verkaufspreis. Er fällt bei jedem Kauf und Verkauf an, daher kostet häufiges Handeln spürbar Rendite.</p>"+ex("Bei 1 % Spread und 20 Trades im Jahr sind schnell 10 % und mehr weg – ein Jahr Aktienrendite."),["depot","Mein Depot"])+
K("Sparplan / Cost-Average-Effekt","<p>Regelmäßig den gleichen Betrag investieren. Bei tiefen Kursen bekommt man mehr Anteile, bei hohen weniger. Man muss den richtigen Zeitpunkt nicht erraten.</p>"+ex("100 € im Monat: Kurs 50 € → 2 Anteile, Kurs 25 € → 4 Anteile. Durchschnittspreis 33,33 € statt 37,50 €."))+
K("News-Markierungen: bestätigt, Gerücht, Meinung","<p>Jede Meldung im News-Reiter hat ein farbiges Abzeichen. <b style='color:#22c55e'>Grün „bestätigt“</b>: kommt von einer Nachrichtenagentur oder Zeitung (Reuters, Bloomberg, FT, Handelsblatt, CNBC, WSJ, CoinDesk), vom offiziellen Konto der Firma oder Notenbank – oder mindestens zwei unabhängige Medien berichten dasselbe. <b style='color:#eab308'>Gelb „Gerücht/Leak“</b>: (noch) nicht bestätigt, etwa ein Leak oder eine Zusammenfassung vieler X-Posts. Kann stimmen, aber Vorsicht. <b style='color:#3b82f6'>Blau „Meinung“</b>: Einschätzung bekannter Markt-Stimmen wie Mohamed El-Erian, Ray Dalio, Holger Zschäpitz, Jim Cramer oder Florian Homm – keine Nachricht, sondern eine Sicht.</p><p>Alle Quellen werden mitgeschrieben. Nach einigen Wochen messen wir, wie oft sich der Kurs nach 1, 5 und 20 Tagen in die Richtung bewegt hat, die eine Quelle angedeutet hat. Quellen, die nichts taugen, fliegen raus.</p>"+ex("Alphabet −13 %: Reuters, CNBC und Bloomberg melden dasselbe → grün. Ein unbekanntes Konto schreibt „Insider: Google kauft Firma X“ → gelb, bis ein Medium es bestätigt."),["news","News"])+
H("🧭 Anlagestrategien")+
K("Buy & Hold / ETF-Weltportfolio","<p>Breit gestreute ETFs (z. B. MSCI World) kaufen und jahrelang halten. Wenig Aufwand, geringe Kosten, historisch solide Rendite.</p>"+ex("Der MSCI World ist in jedem 15-Jahres-Zeitraum seit 1970 im Plus gewesen."),["muster","Musterdepot"])+
K("Core-Satellite","<p>Ein großer, ruhiger Kern (z. B. 70–90 % Welt-ETF) plus kleine Satelliten für Ideen, Themen oder Krypto. So bleibt Spielraum, ohne das Ganze zu riskieren.</p>"+ex("1.000 €: 800 € Welt-ETF, 100 € Halbleiter-ETF, 100 € Bitcoin."))+
K("Sparplan","<p>Automatisch jeden Monat investieren. Diszipliniert, emotionslos, ideal für den Vermögensaufbau. Bitpanda bietet Sparpläne für Aktien, ETFs und Krypto.</p>")+
K("Momentum / Trendfolge","<p>Kaufen, was gerade steigt, und verkaufen, wenn der Trend bricht. Funktioniert in klaren Trends gut, in Seitwärtsphasen kommt es zu vielen Fehlsignalen.</p>"+ex("Regel: halten, solange der Kurs über dem MA200 liegt; darunter aussteigen."),["signale","Signale"])+
K("Value","<p>Unterbewertete Firmen kaufen, die günstig im Verhältnis zu Gewinn oder Vermögen sind. Braucht Geduld, manchmal Jahre.</p>"+ex("KGV 10 statt Marktdurchschnitt 20 – aber prüfen, ob es einen guten Grund für den Abschlag gibt."))+
K("Dividenden","<p>Firmen, die regelmäßig Gewinne ausschütten. Gibt laufendes Einkommen, aber die Dividende ist kein Geschenk – der Kurs sinkt um den ausgezahlten Betrag.</p>"+ex("OMV oder Verbund zahlen jährlich Dividenden; in Österreich fällt KESt an."))+
K("Rebalancing","<p>Regelmäßig (z. B. jährlich) die Gewichte zurück auf das Ziel bringen. Verkauft automatisch, was gut lief, und kauft nach, was billig wurde.</p>"+ex("Ziel 80/20: Krypto ist auf 35 % gestiegen → zurück auf 20 % verkaufen und in den ETF umschichten."),["muster","Musterdepot (Modell)"])+
K("Krypto-Anteil begrenzen","<p>Krypto kann 70–80 % fallen. Daher nur einen Anteil, dessen Totalverlust man aushält – oft 5–10 % des Depots.</p>"+ex("Bei 5.000 € Depot und 10 % Grenze: maximal 500 € Krypto."))+
H("🛡️ Risikomanagement")+
K("Stop-Loss","<p>Ein vorher festgelegter Kurs, bei dem man verkauft, um Verluste zu begrenzen. Der wichtigste Schutz gegen das Hoffen.</p>"+ex("Kauf bei 100 €, Stop bei 92 € → maximal etwa 8 % Verlust."),["depot","Mein Depot"])+
K("Trailing Stop","<p>Ein Stop, der mit steigendem Kurs mitwandert, aber nie fällt. Sichert Gewinne, lässt Trends laufen.</p>"+ex("Trailing 10 %: Kurs steigt von 100 auf 130 € → Stop steigt von 90 auf 117 €."))+
K("Nachziehender Stop mit ATR (Chandelier)","<p>Statt eines festen Prozentwerts richtet sich der Abstand nach der normalen Schwankung (ATR). Stop = höchster Kurs der letzten 22 Tage minus k × ATR. Ruhige Werte bekommen einen engen, wilde Werte einen weiten Stop.</p>"+ex("Hoch 100 €, ATR 2 €, k = 4 → Stop bei 92 €. Steigt das Hoch auf 110 €, steigt der Stop auf 102 €."),["ausstieg","Ausstieg"])+
K("Teilgewinne mitnehmen","<p>Nicht alles auf einmal verkaufen: an Kurszielen (Widerstand, Fibonacci-Erweiterung) z. B. ein Drittel verkaufen und den Rest mit nachziehendem Stop laufen lassen. Den perfekten Höchstpunkt trifft niemand.</p>"+ex("Ziel 1 erreicht: 1/3 verkaufen. Ziel 2: noch 1/3. Der Rest läuft, bis der Trailing-Stop greift. Im Backtest senkte das die Abstürze, kostete aber Rendite."),["ausstieg","Ausstieg"])+
K("Chance-Risiko-Verhältnis (CRV)","<p>Möglicher Gewinn bis zum Ziel geteilt durch möglichen Verlust bis zum Stop. Ab etwa 2 kann man öfter falsch liegen und trotzdem gewinnen.</p>"+ex("Kurs 100 €, Ziel 115 €, Stop 95 € → CRV = 15 ÷ 5 = 3."),["ausstieg","Ausstieg"])+
K("Positionsgröße","<p>Bestimmt, wie viel man pro Idee riskiert. Faustregel: pro Trade nicht mehr als 1–2 % des Depots verlieren können.</p>"+ex("Depot 5.000 €, Risiko 1 % = 50 €. Stop 10 % unter Einstieg → Position maximal 500 €."))+
K("Chance-Risiko-Verhältnis (CRV)","<p>Möglicher Gewinn bis zum Ziel geteilt durch möglichen Verlust bis zum Stop. Ab etwa 2 lohnt sich eine Idee auch, wenn nur jeder zweite Trade aufgeht.</p>"+ex("Einstieg 100 €, Ziel 120 €, Stop 90 € → CRV 20/10 = 2,0."),["ideen","Investment-Ideen"])+
K("Mindestabstand beim Stop","<p>Ein zu enger Stop wird vom normalen Rauschen ausgelöst. Die App setzt Stops daher an Fibonacci-Unterstützungen, mindestens aber mit Abstand nach ATR (typische Tagesschwankung).</p>"+ex("ATR 3 % → ein Stop 1 % unter dem Kurs würde fast sicher ausgelöst."),["ideen","Investment-Ideen"])+
K("Backtest: Hat die Ampel früher funktioniert?","<p>Wir haben die Ampel rückwirkend auf bis zu 98 Jahren Kursgeschichte durchgespielt, jeden Tag nur mit den Daten, die es damals gab. Ergebnis: Bei Krypto hilft sie spürbar, bei Aktien und Indizes ist der Vorteil sehr klein. Sie ist also eher ein Lagebericht als eine Glaskugel.</p>",["backtest","Backtest"])+
K("Prognose: Kann man Kurse vorhersagen?","<p>Das Prognose-Modell lernt aus Jahrzehnten Kursgeschichte, wie es nach ähnlichen Lagen weiterging, und gibt Wahrscheinlichkeiten statt Gewissheiten aus. Im ehrlichen Test auf unbekannten Jahren war die Richtung kaum vorhersagbar; große Ausschläge lassen sich etwas besser erahnen. Jede Prognose wird gespeichert und nach 20 Tagen überprüft.</p>",["prognose","Prognose"])+
H("📊 Indikatoren in der App")+
K("MA20 / MA50 / MA200","<p>Gleitende Durchschnitte der letzten 20, 50 bzw. 200 Tage. Kurs über dem Durchschnitt = Aufwärtstrend. MA20 kurzfristig, MA200 langfristig.</p>"+ex("Kurs 110 €, MA200 100 € → 10 % über dem langfristigen Trend."),["ampel","Ampel"])+
K("Golden Cross / Death Cross","<p>Golden Cross: MA50 kreuzt den MA200 nach oben – Zeichen für einen neuen Aufwärtstrend. Death Cross: umgekehrt. Kommen oft spät, filtern aber Rauschen.</p>",["start","Heute (Alarme)"])+
K("RSI","<p>Relative Strength Index (0–100): Verhältnis der Auf- zu Abwärtsbewegungen der letzten 14 Tage. Über 70 heiß gelaufen, unter 30 stark abverkauft.</p>"+ex("RSI 85 nach einer Rally: Rücksetzer wahrscheinlicher, aber starke Trends können lange überkauft bleiben."),["ampel","Ampel"])+
K("MACD","<p>Differenz zweier Durchschnitte (12 und 26 Tage) mit Signallinie (9). <b>So liest du es:</b> Blaue Linie über der lila Signallinie = Schwung nimmt zu, darunter = Schwung lässt nach. Die Balken (Histogramm) zeigen den Abstand: wachsende helle Balken = Aufwärtsschwung wird stärker, schrumpfende = er flacht ab. Über der Nulllinie liegt der kurze Schnitt über dem langen (eher Aufwärtstrend). In Seitwärtsphasen gibt es viele Fehlsignale – nie allein handeln.</p>",["heatmap","Detailansicht (Asset antippen)"])+
K("Bollinger-Bänder","<p>Band um den MA20 im Abstand von zwei Standardabweichungen (20 Tage, 2σ). <b>So liest du es:</b> Am oberen Band ist der Kurs im Vergleich zu den letzten Wochen hoch, am unteren tief – das ist aber kein Verkaufs- oder Kaufsignal: In starken Trends „läuft“ der Kurs oft am Band entlang. Werden die Bänder sehr eng (Squeeze), ist es ruhig; danach folgt oft eine größere Bewegung, die Richtung verraten die Bänder nicht.</p>")+
K("Volumen","<p>Wie viel an einem Tag gehandelt wurde (Balken, relativ zum Jahreshöchstwert). <b>So liest du es:</b> Steigt der Kurs bei hohem Volumen, steht viel Geld dahinter – die Bewegung ist eher belastbar. Steigt er bei dünnem Volumen, ist sie wackeliger. Sehr hohe Ausschläge kommen oft bei News, Zahlen oder Panik. Bei Indizes und Währungen gibt es kein sinnvolles Volumen, dort wird es ausgeblendet.</p>")+

function btAmpel(){ const A=D.BA; if(!A||!A.farbe) return `<div class="disc">Langzeit-Backtest noch nicht berechnet.</div>`;
const H=btH, K=baK, p1=v=>v==null?"–":dz(v,1), sp=v=>v==null?"–":(v>0?"+":"")+dz(v,1);
const KL=["gesamt",...A.klassen], KN={gesamt:"Alle"}, COL={gruen:"#22c55e",gelb:"#f5b82e",rot:"#f04461"}, FN={gruen:"Grün",gelb:"Gelb",rot:"Rot"};
const sig=t=>t==null?"":Math.abs(t)>=2?`<span class="pos" title="Unterschied zur Basis deutlich größer als der Zufall">deutlich</span>`:`<span class="mute" title="Kann Zufall sein">kann Zufall sein</span>`;
const g=A.farbe.gruen[K]["h"+H], r=A.farbe.rot[K]["h"+H];
let h=`<div class="card bt-in"><h3>⏪ Hat die Ampel in der Vergangenheit funktioniert?</h3><p>Für ${A.n_assets} Assets wurde jeder Handelstag von ${A.zeitraum.von.slice(0,4)} bis heute nachgespielt: Ampel mit den Daten, die es an diesem Tag gab, und dann geschaut, wo der Kurs ${H} Handelstage später stand. Die <b>Basis</b> ist, was dasselbe Asset an irgendeinem Tag gebracht hat. Ist Grün besser als die Basis, hilft die Ampel.</p></div>
<div class="seg">${[5,20,60].map(k=>`<button data-bt="${k}" class="${k===H?"on":""}">${k} Tage</button>`).join("")}</div>
<div class="chips" style="margin:10px 0">${KL.map(k=>`<button class="chip ${k===K?"on":""}" data-bak="${k}">${KN[k]||k}</button>`).join("")}</div>`;
if(g) h+=`<div class="kpis"><div class="kpi"><small>Grün: Kurs danach höher</small><b class="pos">${p1(g.hit)} %</b><span class="mute">Basis ${p1(g.base_hit)} % · ${sp(g.hit-g.base_hit)} Pp</span></div>
<div class="kpi"><small>Grün: Ø Rendite ${H}T</small><b class="${cls(g.edge)}">${sp(g.avg)} %</b><span class="mute">Basis ${sp(g.base_avg)} % · ${sig(g.t)}</span></div>
${r?`<div class="kpi"><small>Rot: Ø Rendite ${H}T</small><b class="${cls(r.edge)}">${sp(r.avg)} %</b><span class="mute">Basis ${sp(r.base_avg)} % · ${sig(r.t)}</span></div>`:""}</div>`;
h+=`<div class="sec">Trefferquote je Farbe (Anteil Fälle mit höherem Kurs nach ${H} Tagen)</div><div class="card">`+["gruen","gelb","rot"].map(f=>{const s=A.farbe[f][K]["h"+H]; if(!s) return "";
return `<div class="bt-r"><div class="bt-l"><span class="dot" style="background:${COL[f]}"></span><b>${FN[f]}</b><small class="mute">${s.n.toLocaleString("de-AT")} Tage</small></div>
<div class="bt-b"><i style="width:${s.hit}%;background:${COL[f]}"></i><u style="left:${s.base_hit}%" title="Basis ${p1(s.base_hit)} %"></u></div><div class="bt-v"><b>${p1(s.hit)} %</b><small class="${cls(s.edge)}">Ø ${sp(s.avg)} % (${sp(s.edge)})</small></div></div>`;}).join("")+
`<div class="leg">Balken = Trefferquote, weißer Strich = Basis desselben Assets. In Klammern: Ø Rendite minus Basis in Prozentpunkten.</div></div>`;
const P=A.punkte, vals=Object.keys(P).map(k=>[k,P[k]["h"+H]]).filter(x=>x[1]), mx=Math.max(...vals.map(x=>Math.abs(x[1].edge)),.5);
h+=`<div class="sec">Nach Ampel-Punkten (0–8, alle Assets)</div><div class="card"><div class="bt-pk">${vals.map(([k,s])=>`<div title="${s.n} Tage, Treffer ${p1(s.hit)} %"><span class="${cls(s.edge)}">${sp(s.edge)}</span><div class="bt-col"><i style="height:${Math.abs(s.edge)/mx*100}%;background:${s.edge>=0?"var(--g)":"var(--r)"}"></i></div><small>${k}</small></div>`).join("")}</div>
<div class="leg">Ø Rendite nach ${H} Tagen minus Basis (Pp). 8 Punkte = alle vier Einzelampeln grün.</div></div>`;
h+=`<div class="sec">Einzelsignale (${KN[K]||K}, ${H} Tage)</div><div class="grid">`+Object.values(A.signale).map(o=>{const s=o[K]["h"+H]; if(!s) return "";
const gut=o.richtung? s.edge*o.richtung>0 : null;
return `<div class="card"><h3>${o.richtung>0?"▲":o.richtung<0?"▼":"◆"} ${esc(o.label)}</h3><div class="bt-g"><div><small>Fälle</small><b>${s.n.toLocaleString("de-AT")}</b></div><div><small>Treffer</small><b>${p1(s.hit)} %</b><span class="mute">Basis ${p1(s.base_hit)} %</span></div><div><small>vs. Basis</small><b class="${cls(s.edge)}">${sp(s.edge)} Pp</b><span>${sig(s.t)}</span></div></div>
<p class="mute" style="font-size:12px;margin:6px 0 0">${o.richtung>0?(gut?"Danach lief es im Schnitt etwas besser als normal.":"Danach lief es nicht besser als normal."):o.richtung<0?(gut?"Danach lief es im Schnitt schwächer als normal – Warnung bestätigt.":"Die Warnung hat sich im Schnitt nicht bestätigt."):"Sagt keine Richtung, nur ob danach viel Bewegung kommt (siehe unten)."}</p></div>`;}).join("")+`</div>`;
const q=A.squeeze["h"+H]; if(q) h+=`<div class="card" style="margin-top:12px"><h3>◆ Kommt nach einem Bollinger-Engpass ein großer Ausschlag?</h3><p>Ø Bewegung (egal welche Richtung) nach ${H} Tagen: <b>${p1(q.betrag)} %</b> statt normal ${p1(q.normal)} % (Faktor ${dz(q.verhaeltnis,2)}, ${q.n.toLocaleString("de-AT")} Fälle). ${q.verhaeltnis>1.05?"Ja, danach bewegt sich mehr.":"Nein, mit unserer einfachen Regel nicht – im Schnitt kommt danach nicht mehr Bewegung als sonst."}</p></div>`;
h+=`<div class="disc" style="margin-top:12px"><b>Was heißt das?</b> Die Unterschiede zur Basis sind klein, meist unter 1 Prozentpunkt. Am stärksten wirkt die Ampel bei Krypto: Grün lag dort deutlich über, Rot deutlich unter der Basis. Bei Aktien, Indizes und Rohstoffen ist sie eher eine Zustandsbeschreibung als ein Vorteil.<br><br><b>Vorsicht:</b> Aufeinanderfolgende Tage teilen sich fast dieselbe Zukunft, deshalb sind die Fallzahlen größer, als sie wirken. „deutlich“ heißt, dass der Unterschied nach dieser Korrektur größer als der Zufall ist. Getestet wurden nur Assets, die es heute noch gibt (Survivorship-Bias), lange Index-Reihen ab 1928 prägen die Gesamtwerte, Kosten und Steuern sind nicht drin. Stand ${esc(A.erstellt)}.</div>`;
return h;}

function pgV4(G){ const T=G.v4; if(!T||!T.v3) return ""; const KL=["Aktien","ETFs/Indizes","Krypto","Rohstoffe"], f=x=>x==null?"–":dz(x*100,1);

<p><b>Getestet und verworfen:</b> Implizite Volatilität aus dem Optionsmarkt (machte Spannen und Richtung bei Aktien/ETFs nicht besser), Krypto-On-Chain-Daten (bei Krypto sogar schlechter) und Cross-Asset-Signale (nur bei Krypto minimal besser, sonst schlechter). <b>Noch in Sammlung:</b> News-Stimmung aus X (erst ${(G.news?G.news.tage:0)===1?"1 Tag":(G.news?G.news.tage:0)+" Tage"} Historie – wird täglich gespeichert und getestet, sobald genug da ist) und die Live-Verlässlichkeit je Asset (ab ca. Ende November).</p>
<details class="wk"><summary>🧪 Testergebnisse im Detail (Trefferschärfe ×100, 50 = Zufall)</summary><div>${["zahlen","iv","onchain","cross"].filter(n=>T[n]).map(row).join("")}</div></details>`; }
function pgHilfe(k,V2,pc,sg,RB){ const vk=V2.klassen[k.k]||{}, vg=(V2.vergleich||{})[k.k]||{}, rg=vg.rang_v2||{}, r=RB[k.rel]||RB.schwach, d=k.up-k.basis, n10=x=>dz(x/10,0).replace(",0","");
const s0=k.sig[0]||["–","–",0], ex=Math.round(k.up/10);
const dot=n=>`<i class="pg-n">${n}</i>`;
const mock=`<div class="pg-mock"><div class="pg-h"><div><b>${esc(k.n)}</b><small>${esc(k.k)}</small></div><span class="pg-hd"><span class="pg-rb ${r[0]}">${r[1]}</span>${dot(7)}</span></div>
<div class="pg-p"><div><big>${pc(k.up)}</big>${dot(1)}<small>Chance auf Plus · üblich ${pc(k.basis)}</small></div><div class="pg-x"><span>🚀 <b>${pc(k.bu)}</b>${dot(4)}</span><span>💥 <b>${pc(k.bd)}</b>${dot(4)}</span></div></div>
<div class="pg-lab">🏁 Klasse schlagen <b>${pc(k.rk)}</b>${dot(5)}</div>
<div class="pg-lab">Spanne 20 Tage ${dot(2)} · Mitte ${dot(3)}</div><div class="pg-rl"><span>${sg(k.q10)}</span><span>${sg(k.q50)}</span><span>${sg(k.q90)}</span></div>
<div class="pg-sig"><span class="${s0[2]>0?"pos":"neg"}">${s0[2]>0?"▲":"▼"} ${esc(s0[0])}</span>${dot(6)}</div></div>`;
const li=(n,t,b)=>`<div class="pg-e">${dot(n)}<div><b>${t}</b><br>${b}</div></div>`;
return `<details class="wk" id="pghelp"><summary>❓ Hilfe: So liest du eine Prognose-Karte</summary><div>
<p>Musterbeispiel mit einer echten Karte von heute: <b>${esc(k.name)}</b> (Stand ${esc(k.d)}). Die Zahlen ① bis ⑦ sind unten erklärt.</p>${mock}
${li(1,`Chance auf Plus: ${pc(k.up)}`,`In ähnlichen Lagen aus der Vergangenheit stand der Kurs 20 Handelstage (ca. 4 Wochen) später in etwa <b>${ex} von 10 Fällen</b> höher. Wichtig ist der Vergleich mit dem üblichen Wert der Klasse (${pc(k.basis)}): ${Math.abs(d)<1?"hier fast gleich, also <b>kein echtes Signal</b>.":d>0?`hier ${dz(d,1)} Punkte darüber – ein leichter Rückenwind.`:`hier ${dz(-d,1)} Punkte darunter – ein leichter Gegenwind.`}`)}
${li(2,`Spanne ${sg(k.q10)} bis ${sg(k.q90)}`,`In 8 von 10 ähnlichen Fällen lag das Ergebnis nach 20 Tagen in diesem Bereich. In 1 von 10 Fällen war es schlechter als ${sg(k.q10)}, in 1 von 10 besser als ${sg(k.q90)}. Bei 1.000 € wären das grob ${(k.q10<0?"−":"+")+dz(Math.abs(k.q10*10),0)} € bis ${(k.q90<0?"−":"+")+dz(Math.abs(k.q90*10),0)} €.`)}
${li(3,`Mitte (Median) ${sg(k.q50)}`,`Der „typische“ Ausgang: die Hälfte der ähnlichen Fälle lag darüber, die Hälfte darunter. Kein Kursziel!`)}
${li(4,`Ausbruch ${pc(k.bu)} · Absturz ${pc(k.bd)}`,`Wie wahrscheinlich eine ungewöhnlich große Bewegung ist – mehr als das 1,5-Fache der üblichen 20-Tage-Bewegung dieses Werts (üblich: ±${dz(k.typ,1)} %), also über ${sg(1.5*k.typ)} bzw. unter ${sg(-1.5*k.typ)}. Beides hoch heißt: unruhige Phase, Richtung offen.`)}
${li(5,`Klasse schlagen: ${pc(k.rk)}`,`Chance, dass ${esc(k.n)} in 20 Tagen besser läuft als der mittlere Wert seiner Klasse (${esc(k.k)}). Üblich sind ca. ${dz(rg.basis_rang||48,0)} %. Das ist der Teil, der im Test am ehesten funktioniert: die besten 10 % dieser Werte schlugen ihre Klasse in ${dz(rg.top_rang_quote,0)} % der Fälle.`)}
${li(6,"Top-Signale ▲▼",`Die Gründe, die die Chance gerade am stärksten nach oben (▲) oder unten (▼) schieben, z. B. „${esc(s0[0])}: ${esc(String(s0[1]))}“. Sie zeigen, <i>warum</i> das Modell so rechnet – nicht, dass es stimmt.`)}
${li(7,`Abzeichen „${r[1]}“`,`Wie gut das Modell bei diesem Wert bzw. seiner Klasse im Test auf unbekannten Jahren getroffen hat. Trefferschärfe ${esc(k.k)}: ${vk.auc?dz(vk.auc*100,1):"–"} (50 = Zufall, 55–60 wäre an der Börse schon gut).`)}
<div class="wk-ex"><b>Was heißt eigentlich „60 %“?</b> Nicht „sicher steigend“, sondern: von 10 vergleichbaren Situationen gingen 6 nach oben und 4 nach unten. Auch eine 60-%-Prognose liegt also in 4 von 10 Fällen daneben – ganz normal. Ein Münzwurf hat 50 %.</div>
<p><b>Zusammen mit Ampel und Chart lesen:</b> Am meisten Gewicht hat ein Bild, wenn mehrere Dinge in die gleiche Richtung zeigen: Ampel grün (Trend intakt), Prognose über dem Klassenwert, Kurs im Chart über der 200-Tage-Linie bzw. der Ichimoku-Wolke und mit Abstand zum nächsten Widerstand. Widersprechen sie sich, lieber abwarten. Ein Klick auf die Karte öffnet den Chart.</p>
<p><b>Wofür die Prognose allein nicht taugt:</b> als einziger Kaufgrund, für kurzfristiges Zocken über wenige Tage, für Kursziele, bei Nachrichten (Zahlen, Übernahmen, Krisen kennt das Modell nicht) und für Werte mit sehr kurzer Kursgeschichte.</p>
<div class="wk-ex"><b>Beispiel-Entscheidung mit ${esc(k.n)}:</b><br>1. Chance ${pc(k.up)} vs. üblich ${pc(k.basis)} → ${Math.abs(d)<2?"kaum Unterschied, also neutral.":d>0?"leicht positiv.":"leicht negativ."}<br>
2. Klasse schlagen ${pc(k.rk)} → ${k.rk>=52?"eher stärker als die Klasse.":k.rk<=44?"eher schwächer als die Klasse.":"ungefähr Durchschnitt."}<br>
3. Spanne ${sg(k.q10)} bis ${sg(k.q90)} → Kann ich einen Rückgang von ${sg(k.q10)} in 4 Wochen aushalten? Wenn nein: kleinere Summe.<br>
4. Ampel ${k.ampel!=null?`${k.ampel} von 8 Punkten`:"–"} und Chart prüfen → zeigen sie in dieselbe Richtung?<br>
5. Abzeichen „${r[1]}“ → ${k.rel==="gut"?"das Modell hat hier früher brauchbar getroffen.":"das Modell hat hier bisher kaum getroffen, also nur als Randnotiz nehmen."}<br>
Fazit: Nur wenn 1–4 zusammenpassen, kommt der Wert auf die Beobachtungsliste. Gekauft wird schrittweise und mit Summen, deren Verlust man verkraftet.</div>
${li(8,"📅 Zahlentermin, 📰 Stimmung, 🎯 Live-Treffer",`Unter der Karte steht bei Aktien der nächste Quartalszahlen-Termin${k.ez?` (bei ${esc(k.n)}: ${pgD(k.ez)})`:""}. Liegt er in den nächsten 4 Wochen, ist das Modell vorgewarnt: Ausbruch, Absturz und Spanne berücksichtigen dann, dass Kurse rund um Zahlen stärker springen. 📰 zeigt die heutige Stimmung aus den X-News (wird gesammelt, fließt aber noch nicht in die Chance ein). 🎯 zeigt, wie oft die Live-Prognosen bei diesem Wert wirklich gestimmt haben – sinnvoll erst ab ca. Ende November, wenn genug Prognosen 20 Tage alt sind.`)}
<p><b>Ehrliche Bilanz bisher:</b> Im Test 2012–heute lag die Trefferschärfe für Rauf/Runter je Klasse zwischen ${dz(Math.min(...Object.values(V2.klassen).map(m=>m.auc||.5))*100,1)} und ${dz(Math.max(...Object.values(V2.klassen).map(m=>m.auc||.5))*100,1)} – also nahe am Zufall. Brauchbar sind die Spannen (${dz((V2.gesamt||{}).abdeckung_10_90,0)} % Treffer, Ziel 80 %), die Ausbruch-Warnung bei ETFs und leicht das „Klasse schlagen“. Die echte Live-Bilanz erscheint ab ca. Ende November weiter unten.</p></div></details>`; }
